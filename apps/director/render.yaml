services:
  - type: web
    name: director-backend
    region: singapore
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: FLASK_APP
        value: director.entrypoint.api.server
      - key: SERVER_DEBUG
        value: 0
      - key: VIDEO_DB_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: DB_TYPE
        value: sqlite
      - key: SQLITE_DB_PATH
        value: director.db
    healthCheckPath: /health
    
  - type: web
    name: director-frontend
    region: singapore
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_APP_BACKEND_URL
        fromService:
          type: web
          name: director-backend
          property: host
      - key: VITE_PORT
        value: 8080
      - key: VITE_OPEN_BROWSER
        value: false
