[build]
  base = "."
  publish = "dist"
  ignore = "git diff --quiet HEAD^ HEAD apps/ packages/ modules/"
  # Use build:all to support workspace architecture (packages/*, apps/*, modules/*)
  # This runs build:remix-go followed by the main build process
  command = "npm run build:all"

[build.environment]
  NODE_VERSION = "20"

# Environment variables are set via Netlify CLI or dashboard
# Do not commit secrets to this file

# Frontend Environment Variables (for local development)
VITE_DIRECTOR_BACKEND_URL=http://localhost:8000

# Add build hooks if needed
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true