# Security Headers
[[headers]]
  for = "/*"
    [headers.values]
      # Prevent clickjacking
      X-Frame-Options = "DENY"
      # Prevent MIME sniffing
      X-Content-Type-Options = "nosniff"
      # XSS protection
      X-XSS-Protection = "1; mode=block"
      # Strict Transport Security (HSTS) - enable after validation
      Strict-Transport-Security = "max-age=31536000; includeSubDomains"
      # Referrer policy
      Referrer-Policy = "strict-origin-when-cross-origin"
      # Permissions Policy
      Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
      # Content Security Policy - allows unsafe-inline for styles from external repos
      Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'nonce-${NONCE}'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.muapi.ai https://supabase.co https://*.supabase.co https://api.openai.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; block-all-mixed-content;"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true
