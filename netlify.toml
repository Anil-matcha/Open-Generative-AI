[build]
  publish = "dist"
  # Use pnpm for better monorepo support
  command = "pnpm install && npm run build:all"

[functions]
  directory = "netlify/functions/dist"

[build.environment]
  NODE_VERSION = "20"

# Environment variables are set via Netlify CLI or dashboard
# Do not commit secrets to this file

# Frontend Environment Variables (for local development)

# Add build hooks if needed
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true