# Netlify Configuration - Single Source of Truth
# This file consolidates all Netlify-specific configuration for the Open-Higgsfield-AI monorepo

[build]
  # Publish directory for built assets
  publish = "dist"
  
  # Build command - builds the main Vite application
  command = "npx vite build"
  
  # Netlify Functions directory
  functions = "netlify/functions/dist"

[build.environment]
  # Node.js version for build and functions
  NODE_VERSION = "20"
  
  # Production optimizations
  NODE_OPTIONS = "--max-old-space-size=4096"

[functions]
  # Serverless functions directory
  directory = "netlify/functions/dist"
  
  # Function-level configuration
  [functions."*"]
    # 60-second timeout for long-running AI operations
    timeout = 60
    # 1GB memory for video processing functions
    memory = 1024

# Redirects: SPA routing, API proxy, and app-specific routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/api/*"
  to = "https://api.muapi.ai/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/apps/storyboarder/*"
  to = "/apps/storyboarder/index.html"
  status = 200
  force = false

# Security Headers
[[headers]]
  for = "/*"
    [headers.values]
      # Prevent clickjacking
      X-Frame-Options = "DENY"
      # Prevent MIME sniffing
      X-Content-Type-Options = "nosniff"
      # Referrer policy
      Referrer-Policy = "strict-origin-when-cross-origin"
      # Content Security Policy (adjust as needed for your assets)
      Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.muapi.ai https://supabase.co wss://*.supabase.co; frame-ancestors 'none';"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true
