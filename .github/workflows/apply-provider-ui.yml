name: Apply provider UI integration

on:
  push:
    branches:
      - feat/multi-provider-ai

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[provider-integration]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Integrate Image Studio provider picker
        shell: python
        run: |
          from pathlib import Path
          path = Path('packages/studio/src/components/ImageStudio.jsx')
          text = path.read_text(encoding='utf-8')
          old_import = 'import { generateImage, generateI2I, uploadFile } from "../muapi.js";'
          new_import = 'import { generateImage, generateI2I } from "../providerAwareImage.js";\nimport { uploadFile } from "../muapi.js";'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          marker = 'import ProviderPicker from "./ProviderPicker.jsx";'
          if marker not in text:
              anchor = 'import { resolveCopy } from "../i18nUtils";'
              text = text.replace(anchor, anchor + '\n' + marker, 1)
          if '<ProviderPicker />' not in text:
              text = text.replace('      <PromptComposer>', '      <ProviderPicker />\n      <PromptComposer>', 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/studio/src/components/ImageStudio.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(studio): integrate provider picker [provider-integration]"
          git push
